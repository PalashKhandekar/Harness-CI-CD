pipeline:
  name: food-store-ec2-deploy
  identifier: food_store_ec2_deploy
  projectIdentifier: YOUR_PROJECT_IDENTIFIER
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: YOUR_GIT_CONNECTOR   # e.g. github/gitlab connector identifier
        repoName: YOUR_REPO_NAME
        build: <+input>
  stages:
    - stage:
        name: Build and Deploy
        identifier: Build_and_Deploy
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Package Site
                  identifier: Package_Site
                  type: Run
                  spec:
                    shell: Sh
                    command: |
                      echo "Packaging site..."
                      mkdir -p dist
                      cp index.html dist/
                      tar -czvf foodstore-site.tar.gz -C dist .
              - step:
                  name: Copy to EC2 and Deploy
                  identifier: Copy_And_Deploy
                  type: Run
                  spec:
                    shell: Sh
                    envVariables:
                      EC2_HOST: <+secrets.getValue("ec2_host")>
                      EC2_USER: <+secrets.getValue("ec2_user")>
                      EC2_SSH_KEY: <+secrets.getValue("ec2_ssh_key")>
                    command: |
                      echo "Setting up SSH key..."
                      echo "$EC2_SSH_KEY" > key.pem
                      chmod 600 key.pem

                      echo "Copying artifact to EC2..."
                      scp -o StrictHostKeyChecking=no -i key.pem \
                        foodstore-site.tar.gz "$EC2_USER@$EC2_HOST:/home/$EC2_USER/foodstore-site.tar.gz"

                      echo "Deploying on EC2..."
                      ssh -o StrictHostKeyChecking=no -i key.pem "$EC2_USER@$EC2_HOST" '
                        sudo mkdir -p /var/www/foodstore
                        sudo tar -xzvf /home/'"$EC2_USER"'/foodstore-site.tar.gz -C /var/www/foodstore
                        echo "Restarting nginx..."
                        sudo systemctl restart nginx
                        echo "Deployment complete!"
                      '

                      rm -f key.pem
