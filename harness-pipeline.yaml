pipeline:
  name: food-store-ec2-deploy
  identifier: food_store_ec2_deploy
  projectIdentifier: YOUR_PROJECT_IDENTIFIER
  orgIdentifier: default
  tags: {}

  stages:
    - stage:
        name: Build
        identifier: Build
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Package Site
                  identifier: Package_Site
                  type: Run
                  spec:
                    shell: Sh
                    command: |
                      echo "Packaging site..."
                      mkdir -p dist
                      cp index.html dist/
                      tar -czvf foodstore-site.tar.gz -C dist .

              - step:
                  name: Save Artifact
                  identifier: Save_Artifact
                  type: Run
                  spec:
                    shell: Sh
                    command: |
                      echo "Artifact ready: foodstore-site.tar.gz"

    - stage:
        name: Deploy to EC2
        identifier: Deploy_to_EC2
        type: Deployment
        spec:
          deploymentType: Ssh

          service:
            serviceRef: foodstore_service

          environment:
            environmentRef: production
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ec2_infra

          execution:
            steps:
              - step:
                  name: Deploy Artifact
                  identifier: Deploy_Artifact
                  type: Command
                  timeout: 10m
                  spec:
                    onDelegate: false
                    environmentVariables: []
                    outputVariables: []

                    commandUnits:
                      - identifier: Stop_Old_Service
                        name: Stop old server
                        type: Script
                        spec:
                          shell: Bash
                          source:
                            type: Inline
                            spec:
                              script: |
                                echo "Nothing to stop for static site, skipping..."

                      - identifier: Copy_Artifact
                        name: Copy site files to EC2
                        type: Copy
                        spec:
                          sourceType: Artifact
                          destinationPath: /home/ec2-user/foodstore-site.tar.gz

                      - identifier: Extract_And_Deploy
                        name: Extract and deploy to web root
                        type: Script
                        spec:
                          shell: Bash
                          source:
                            type: Inline
                            spec:
                              script: |
                                sudo mkdir -p /var/www/foodstore
                                sudo tar -xzvf /home/ec2-user/foodstore-site.tar.gz -C /var/www/foodstore
                                echo "Restarting nginx..."
                                sudo systemctl restart nginx
                                echo "Deployment complete!"

            rollbackSteps: []

        tags: {}
